[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workbench"
version = "0.2.0"
description = "Agent engineering teaching reference: real optional model adapter, durable loop, local app, approval and evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["openai>=1.50,<3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
